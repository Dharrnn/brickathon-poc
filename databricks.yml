# Databricks Asset Bundle — deploys the medallion pipeline as a serverless job.
# Free Edition is serverless-only, so no cluster spec is declared (tasks run on
# serverless compute). Deploy with:  databricks bundle deploy -t dev
bundle:
  name: supply-chain-disruption

variables:
  catalog:
    default: workspace
  schema:
    default: supply_chain

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://<your-free-edition-workspace>.cloud.databricks.com

resources:
  jobs:
    scdi_medallion_pipeline:
      name: scdi-medallion-pipeline
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/00_ingest_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: build_silver
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/10_build_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: enrich_weather
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/20_enrich_weather.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: score_gold
          depends_on:
            - task_key: build_silver
            - task_key: enrich_weather
          notebook_task:
            notebook_path: ./notebooks/30_score_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: ai_summaries
          depends_on:
            - task_key: score_gold
          notebook_task:
            notebook_path: ./notebooks/40_genie_summaries.sql
